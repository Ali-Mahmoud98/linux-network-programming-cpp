<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 760" width="100%" height="100%" style="background-color: #0f172a; font-family: &#39;Segoe UI&#39;, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="ptrArrow" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#38bdf8" />
    </marker>
    <marker id="shiftArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <pattern id="diagonalHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" style="stroke:#334155; stroke-width:2" />
    </pattern>
  </defs>

  <rect width="1050" height="760" fill="url(#bgGrad2)" />

  <!-- Title -->
  <text x="525" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">إدارة الذاكرة داخل Linux Kernel — هيكل البيانات (struct sk_buff)</text>
  <text x="525" y="68" text-anchor="middle" fill="#94a3b8" font-size="14">كيف يضيف الـ Kernel الـ Headers في الـ headroom بتحريك المؤشر (Zero-Copy Encapsulation)</text>

  <!-- ==================== STEP 1 ==================== -->
  <g transform="translate(50, 100)">
    <text x="0" y="0" fill="#38bdf8" font-size="16" font-weight="bold">الخطوة 1: نسخ "Hello" من الـ User Space (Boost.Asio) إلى داخل الـ Kernel Space</text>

    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="540" height="60" fill="url(#diagonalHatch)" stroke="#475569" stroke-width="2" />
      <rect x="0" y="0" width="540" height="60" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="2" />
      <text x="270" y="35" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="bold">headroom (مساحة فارغة محجوزة مسبقًا)</text>

      <rect x="540" y="0" width="220" height="60" fill="#0284c7" stroke="#7dd3fc" stroke-width="2" />
      <text x="650" y="27" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">"Hello"</text>
      <text x="650" y="47" text-anchor="middle" fill="#e0f2fe" font-size="12" font-family="monospace">5 Bytes Payload</text>

      <rect x="760" y="0" width="190" height="60" fill="url(#diagonalHatch)" stroke="#475569" stroke-width="2" />
      <rect x="760" y="0" width="190" height="60" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="2" />
      <text x="855" y="35" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="bold">tailroom</text>

      <line x1="2" y1="88" x2="2" y2="66" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#ptrArrow)" />
      <text x="2" y="105" text-anchor="middle" fill="#38bdf8" font-size="14" font-family="monospace" font-weight="bold">head</text>

      <line x1="540" y1="88" x2="540" y2="66" stroke="#34d399" stroke-width="2.5" marker-end="url(#ptrArrow)" />
      <text x="540" y="105" text-anchor="middle" fill="#34d399" font-size="14" font-family="monospace" font-weight="bold">data</text>

      <line x1="760" y1="88" x2="760" y2="66" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#ptrArrow)" />
      <text x="760" y="105" text-anchor="middle" fill="#fbbf24" font-size="14" font-family="monospace" font-weight="bold">tail</text>

      <line x1="948" y1="88" x2="948" y2="66" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ptrArrow)" />
      <text x="948" y="105" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="monospace" font-weight="bold">end</text>
    </g>
  </g>

  <!-- ==================== STEP 2 ==================== -->
  <g transform="translate(50, 265)">
    <text x="0" y="0" fill="#c084fc" font-size="16" font-weight="bold">الخطوة 2: طبقة النقل (TCP Layer)  ➔  <tspan fill="#f43f5e" font-family="monospace">skb_push(20) / data -= 20 bytes</tspan></text>

    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="350" height="60" fill="#1e293b" stroke="#475569" stroke-width="2" />
      <text x="175" y="35" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="bold">headroom</text>

      <rect x="350" y="0" width="190" height="60" fill="#7e22ce" stroke="#d8b4fe" stroke-width="2" />
      <text x="445" y="27" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">TCP Header</text>
      <text x="445" y="47" text-anchor="middle" fill="#f3e8ff" font-size="12" font-family="monospace">20 Bytes</text>

      <rect x="540" y="0" width="220" height="60" fill="#0284c7" stroke="#7dd3fc" stroke-width="2" />
      <text x="650" y="35" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">"Hello"</text>

      <rect x="760" y="0" width="190" height="60" fill="#1e293b" stroke="#475569" stroke-width="2" />
      <text x="855" y="35" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="bold">tailroom</text>

      <path d="M 535 78 L 360 78" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#shiftArrow)" />
      <text x="447" y="95" text-anchor="middle" fill="#fb7185" font-size="12" font-family="monospace">-20 Bytes</text>

      <line x1="2" y1="88" x2="2" y2="66" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#ptrArrow)" />
      <text x="2" y="105" text-anchor="middle" fill="#38bdf8" font-size="14" font-family="monospace" font-weight="bold">head</text>

      <line x1="350" y1="88" x2="350" y2="66" stroke="#c084fc" stroke-width="2.5" marker-end="url(#ptrArrow)" />
      <text x="350" y="112" text-anchor="middle" fill="#c084fc" font-size="13" font-family="monospace" font-weight="bold">data (transport_header)</text>

      <line x1="760" y1="88" x2="760" y2="66" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#ptrArrow)" />
      <text x="760" y="105" text-anchor="middle" fill="#fbbf24" font-size="14" font-family="monospace" font-weight="bold">tail</text>
    </g>
  </g>

  <!-- ==================== STEP 3 ==================== -->
  <g transform="translate(50, 435)">
    <text x="0" y="0" fill="#fbbf24" font-size="16" font-weight="bold">الخطوة 3: طبقة الشبكة (IP Layer)  ➔  <tspan fill="#f43f5e" font-family="monospace">skb_push(20) / data -= 20 bytes</tspan></text>

    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="160" height="60" fill="#1e293b" stroke="#475569" stroke-width="2" />
      <text x="80" y="35" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="bold">headroom</text>

      <rect x="160" y="0" width="190" height="60" fill="#d97706" stroke="#fde68a" stroke-width="2" />
      <text x="255" y="27" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">IPv4 Header</text>
      <text x="255" y="47" text-anchor="middle" fill="#fef3c7" font-size="12" font-family="monospace">20 Bytes</text>

      <rect x="350" y="0" width="190" height="60" fill="#7e22ce" stroke="#d8b4fe" stroke-width="2" />
      <text x="445" y="35" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">TCP Header</text>

      <rect x="540" y="0" width="220" height="60" fill="#0284c7" stroke="#7dd3fc" stroke-width="2" />
      <text x="650" y="35" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">"Hello"</text>

      <rect x="760" y="0" width="190" height="60" fill="#1e293b" stroke="#475569" stroke-width="2" />
      <text x="855" y="35" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="bold">tailroom</text>

      <path d="M 345 78 L 170 78" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#shiftArrow)" />
      <text x="257" y="95" text-anchor="middle" fill="#fb7185" font-size="12" font-family="monospace">-20 Bytes</text>

      <line x1="2" y1="88" x2="2" y2="66" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#ptrArrow)" />
      <text x="2" y="105" text-anchor="middle" fill="#38bdf8" font-size="14" font-family="monospace" font-weight="bold">head</text>

      <line x1="160" y1="88" x2="160" y2="66" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#ptrArrow)" />
      <text x="160" y="112" text-anchor="middle" fill="#fbbf24" font-size="13" font-family="monospace" font-weight="bold">data (network_header)</text>

      <line x1="760" y1="88" x2="760" y2="66" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#ptrArrow)" />
      <text x="760" y="105" text-anchor="middle" fill="#fbbf24" font-size="14" font-family="monospace" font-weight="bold">tail</text>
    </g>
  </g>

  <!-- ==================== STEP 4 ==================== -->
  <g transform="translate(50, 605)">
    <text x="0" y="0" fill="#34d399" font-size="16" font-weight="bold">الخطوة 4: طبقة ربط البيانات (Ethernet Layer)  ➔  <tspan fill="#f43f5e" font-family="monospace">skb_push(14) / data -= 14 bytes</tspan></text>

    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="40" height="60" fill="#1e293b" stroke="#475569" stroke-width="2" />
      <text x="20" y="35" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="bold">head</text>

      <rect x="40" y="0" width="120" height="60" fill="#059669" stroke="#a7f3d0" stroke-width="2" />
      <text x="100" y="27" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Ethernet Hdr</text>
      <text x="100" y="47" text-anchor="middle" fill="#d1fae5" font-size="12" font-family="monospace">14 Bytes</text>

      <rect x="160" y="0" width="190" height="60" fill="#d97706" stroke="#fde68a" stroke-width="2" />
      <text x="255" y="35" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">IPv4 Header</text>

      <rect x="350" y="0" width="190" height="60" fill="#7e22ce" stroke="#d8b4fe" stroke-width="2" />
      <text x="445" y="35" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">TCP Header</text>

      <rect x="540" y="0" width="220" height="60" fill="#0284c7" stroke="#7dd3fc" stroke-width="2" />
      <text x="650" y="35" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">"Hello"</text>

      <rect x="760" y="0" width="190" height="60" fill="#1e293b" stroke="#475569" stroke-width="2" />
      <text x="855" y="35" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="bold">tailroom</text>

      <path d="M 155 78 L 50 78" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#shiftArrow)" />
      <text x="102" y="95" text-anchor="middle" fill="#fb7185" font-size="11" font-family="monospace">-14B</text>

      <line x1="2" y1="88" x2="2" y2="66" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#ptrArrow)" />
      <text x="2" y="105" text-anchor="middle" fill="#38bdf8" font-size="14" font-family="monospace" font-weight="bold">head</text>

      <line x1="40" y1="88" x2="40" y2="66" stroke="#34d399" stroke-width="2.5" marker-end="url(#ptrArrow)" />
      <text x="85" y="114" text-anchor="middle" fill="#34d399" font-size="13" font-family="monospace" font-weight="bold">data (mac_header)</text>

      <line x1="760" y1="88" x2="760" y2="66" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#ptrArrow)" />
      <text x="760" y="105" text-anchor="middle" fill="#fbbf24" font-size="14" font-family="monospace" font-weight="bold">tail</text>
    </g>
  </g>
</svg>