<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 740" width="100%" height="100%" style="background-color: #0f172a; font-family: &#39;Segoe UI&#39;, system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Markers for arrows -->
    <marker id="arrowBroadcast" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowReply" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowTcp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1050" height="740" fill="url(#bgGrad)" />

  <!-- Title -->
  <text x="525" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">ARP (Address Resolution Protocol) — the connecting link between Layer 3 and Layer 2</text>
  <text x="525" y="68" text-anchor="middle" fill="#94a3b8" font-size="14">How does the Linux kernel discover a server's MAC address before the first TCP SYN packet is sent from Boost.Asio?</text>

  <!-- ==================== NODES (CLIENT & SERVER) ==================== -->
  <!-- Client Box (Left) -->
  <g transform="translate(80, 95)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="78" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="130" y="28" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="bold">جهازك (Client)</text>
    <text x="130" y="50" text-anchor="middle" fill="#f8fafc" font-size="14" font-family="monospace">IP: 192.168.1.10</text>
    <text x="130" y="68" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="monospace">MAC: aa:aa:aa:aa:aa:aa</text>
  </g>

  <!-- Server Box (Right) -->
  <g transform="translate(710, 95)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="78" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
    <text x="130" y="28" text-anchor="middle" fill="#c084fc" font-size="16" font-weight="bold">السيرفر (Server)</text>
    <text x="130" y="50" text-anchor="middle" fill="#f8fafc" font-size="14" font-family="monospace">IP: 192.168.1.20</text>
    <text x="130" y="68" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="monospace">MAC: bb:bb:bb:bb:bb:bb</text>
  </g>

  <!-- Lifelines -->
  <line x1="210" y1="173" x2="210" y2="695" stroke="#475569" stroke-width="3" stroke-dasharray="8,6" />
  <line x1="840" y1="173" x2="840" y2="695" stroke="#475569" stroke-width="3" stroke-dasharray="8,6" />

  <!-- ==================== STEP 1: ARP REQUEST (BROADCAST) ==================== -->
  <g transform="translate(0, 210)">
    <!-- Message Card -->
    <g transform="translate(270, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="510" height="68" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" />
      <text x="255" y="25" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="bold">1. ARP Request (Broadcast ➔ Dst MAC: ff:ff:ff:ff:ff:ff)</text>
      <text x="255" y="47" text-anchor="middle" fill="#fde68a" font-size="13">"Hey everyone, who has the IP 192.168.1.20? Please respond to 192.168.1.10."</text>
      <text x="255" y="62" text-anchor="middle" fill="#fdba74" font-size="11" font-family="monospace">EtherType: 0x0806 (ARP)</text>
    </g>

    <!-- Double Broadcast Arrow -->
    <!-- <line x1="215" y1="84" x2="828" y2="84" stroke="#f59e0b" stroke-width="3.5" /> -->
    <line x1="215" y1="90" x2="828" y2="90" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#arrowBroadcast)" />

    <!-- Broadcast Badge on Right -->
    <rect x="855" y="68" width="165" height="34" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
    <text x="937" y="90" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">يوصل لكل الأجهزة (Flood)</text>
  </g>

  <!-- ==================== STEP 2: ARP REPLY (UNICAST) ==================== -->
  <g transform="translate(0, 345)">
    <!-- Message Card -->
    <g transform="translate(270, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="510" height="68" rx="8" fill="#022c22" stroke="#10b981" stroke-width="1.5" />
      <text x="255" y="25" text-anchor="middle" fill="#34d399" font-size="15" font-weight="bold">2. ARP Reply (Unicast ➔ Dst MAC: aa:aa:aa:aa:aa:aa)</text>
      <text x="255" y="47" text-anchor="middle" fill="#a7f3d0" font-size="13">"I have 192.168.1.20, and my MAC address is bb:bb:bb:bb:bb:bb."</text>
      <text x="255" y="62" text-anchor="middle" fill="#6ee7b7" font-size="11" font-family="monospace">Src MAC: bb:bb:bb:bb:bb:bb ➔ Dst MAC: aa:aa:aa:aa:aa:aa</text>
    </g>

    <!-- Unicast Reply Arrow (Right to Left) -->
    <line x1="835" y1="86" x2="222" y2="86" stroke="#10b981" stroke-width="3" stroke-dasharray="10,5" marker-end="url(#arrowReply)" />
  </g>

  <!-- ==================== KERNEL ARP CACHE ACTION ==================== -->
  <g transform="translate(55, 470)" filter="url(#shadow)">
    <rect x="0" y="0" width="310" height="58" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <text x="155" y="24" text-anchor="middle" fill="#a5b4fc" font-size="14" font-weight="bold">[ The kernel stores the result in the ARP cache ]</text>
    <text x="155" y="45" text-anchor="middle" fill="#e0e7ff" font-size="12" font-family="monospace">192.168.1.20 ➔ bb:bb:bb:bb:bb:bb (REACHABLE)</text>
  </g>

  <!-- ==================== STEP 3: TCP SYN (BOOST.ASIO) ==================== -->
  <g transform="translate(0, 565)">
    <!-- Message Card -->
    <g transform="translate(270, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="510" height="68" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1.5" />
      <text x="255" y="25" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="bold">3. Now the kernel can send the TCP SYN for Boost.Asio!</text>
      <text x="255" y="47" text-anchor="middle" fill="#e0f2fe" font-size="13" font-family="monospace">Eth [aa:aa.. ➔ bb:bb..] | IP [.1.10 ➔ .1.20] | TCP [SYN]</text>
      <text x="255" y="62" text-anchor="middle" fill="#7dd3fc" font-size="11" font-family="monospace">EtherType: 0x0800 (IPv4)</text>
    </g>

    <!-- TCP SYN Arrow (Left to Right) -->
    <line x1="215" y1="86" x2="828" y2="86" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arrowTcp)" />
  </g>
</svg>
