<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480"
     font-family="'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <!-- أسهم -->
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e53935"/>
    </marker>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#37474f" flood-opacity="0.18"/>
    </filter>

    <style>
      .ar { direction: rtl; unicode-bidi: embed; }
    </style>
  </defs>

  <!-- خلفية بيضاء -->
  <rect width="1000" height="480" fill="#ffffff"/>

  <!-- الصندوق الخارجي: علبة الراوتر (كل العناصر جواه، زي الرسمة الأصلية) -->
  <rect x="15" y="15" width="970" height="450" rx="14"
        fill="url(#bgGrad)" stroke="#37474f" stroke-width="2.5"/>

  <!-- شريط العنوان -->
  <path d="M 29 15 L 971 15 Q 985 15 985 29 L 985 67 L 15 67 L 15 29 Q 15 15 29 15 Z"
        fill="#37474f"/>
  <text class="ar" x="500" y="48" text-anchor="middle" font-size="19"
        font-weight="bold" fill="#ffffff">علبة الراوتر المنزلي (Home Router Box)</text>

  <!-- ===== 1: Wi-Fi AP ===== -->
  <rect x="360" y="92" width="300" height="70" rx="10"
        fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="510" y="121" text-anchor="middle" font-size="16"
        font-weight="bold" fill="#1b5e20">1. Wi-Fi Access Point</text>
  <text class="ar" x="510" y="144" text-anchor="middle" font-size="13"
        fill="#2e7d32">نقطة الوصول اللاسلكية</text>

  <!-- وصلة AP ↔ Switch (اتجاهين زي الرسمة الأصلية) -->
  <line x1="510" y1="165" x2="510" y2="211" stroke="#37474f" stroke-width="2.5"
        marker-start="url(#arrowDark)" marker-end="url(#arrowDark)"/>

  <!-- ملاحظة 1: ربط الأجهزة بالـ MAC -->
  <rect x="45" y="162" width="280" height="52" rx="8"
        fill="#fffde7" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text class="ar" x="185" y="193" text-anchor="middle" font-size="13.5"
        fill="#6d4c00">(بيربط أجهزتك ببعض بالـ MAC فقط)</text>
  <line x1="325" y1="188" x2="506" y2="188" stroke="#f9a825"
        stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="508" cy="188" r="3" fill="#f9a825"/>

  <!-- ===== 2: L2 Switch ===== -->
  <rect x="360" y="214" width="300" height="76" rx="10"
        fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="510" y="246" text-anchor="middle" font-size="16"
        font-weight="bold" fill="#0d47a1">2. Layer 2 Switch</text>
  <text class="ar" x="510" y="270" text-anchor="middle" font-size="13"
        fill="#1565c0">(أربع فتحات سلك + واي فاي)</text>

  <!-- سهم Switch → Router (شرطي) -->
  <line x1="510" y1="293" x2="510" y2="343" stroke="#e53935"
        stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#arrowRed)"/>

  <!-- ملاحظة 2: شرط الخروج للإنترنت -->
  <rect x="45" y="292" width="280" height="52" rx="8"
        fill="#ffebee" stroke="#e53935" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text class="ar" x="185" y="313" text-anchor="middle" font-size="12.5"
        fill="#b71c1c">(لو الـ Packet رايحة للإنترنت بس،</text>
  <text class="ar" x="185" y="332" text-anchor="middle" font-size="12.5"
        fill="#b71c1c">تطلع للدور التالت)</text>
  <line x1="325" y1="318" x2="506" y2="318" stroke="#e53935"
        stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="508" cy="318" r="3" fill="#e53935"/>

  <!-- ===== 3: L3 Router ===== -->
  <rect x="360" y="346" width="300" height="75" rx="10"
        fill="#fff3e0" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="510" y="376" text-anchor="middle" font-size="16"
        font-weight="bold" fill="#e65100">3. Layer 3 Router</text>
  <text x="510" y="399" text-anchor="middle" font-size="14"
        font-weight="bold" fill="#ef6c00">(192.168.1.1)</text>

  <!-- سهم Router → كابل الإنترنت -->
  <line x1="660" y1="383" x2="764" y2="383" stroke="#e53935"
        stroke-width="3" marker-end="url(#arrowRed)"/>

  <!-- كابل الإنترنت الخارجي (جوه العلبة زي الرسمة الأصلية) -->
  <rect x="770" y="346" width="180" height="75" rx="10"
        fill="#ffebee" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text class="ar" x="860" y="378" text-anchor="middle" font-size="14"
        font-weight="bold" fill="#b71c1c">كابل الإنترنت</text>
  <text class="ar" x="860" y="400" text-anchor="middle" font-size="14"
        font-weight="bold" fill="#b71c1c">الخارجي</text>

</svg>