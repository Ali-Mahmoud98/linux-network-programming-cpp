<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920" width="100%" height="100%" style="background-color: #0f172a; font-family: &#39;Segoe UI&#39;, system-ui, -apple-system, sans-serif;" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowRight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowLeft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowDataRight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arrowFin" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185" />
    </marker>
    <linearGradient id="bgGradTcp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="1100" height="920" fill="url(#bgGradTcp)" />

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">TCP lifecycle and its relationship to Boost.Asio and the Linux kernel</text>
  <text x="550" y="62" text-anchor="middle" fill="#94a3b8" font-size="14">3-Way Handshake  ➔  Byte Stream (Seq/ACK)  ➔  4-Way Graceful Teardown</text>

  <!-- Client & Server Boxes -->
  <g transform="translate(150, 80)">
    <rect x="0" y="0" width="220" height="58" rx="8" fill="#0284c7" stroke="#7dd3fc" stroke-width="2" />
    <text x="110" y="25" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">TCP Client</text>
    <text x="110" y="45" text-anchor="middle" fill="#e0f2fe" font-size="12" font-family="monospace">192.168.1.10 : 50111</text>
  </g>

  <g transform="translate(730, 80)">
    <rect x="0" y="0" width="220" height="58" rx="8" fill="#059669" stroke="#6ee7b7" stroke-width="2" />
    <text x="110" y="25" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Asio C++ Server</text>
    <text x="110" y="45" text-anchor="middle" fill="#d1fae5" font-size="12" font-family="monospace">192.168.1.21 : 8080 (LISTEN)</text>
  </g>

  <!-- Vertical Timelines -->
  <line x1="260" y1="138" x2="260" y2="880" stroke="#475569" stroke-width="3" stroke-dasharray="6,6" />
  <line x1="840" y1="138" x2="840" y2="880" stroke="#475569" stroke-width="3" stroke-dasharray="6,6" />

  <!-- ================= PHASE 1: 3-WAY HANDSHAKE ================= -->
  <rect x="30" y="155" width="1040" height="205" rx="8" fill="#1e293b" fill-opacity="0.55" stroke="#334155" stroke-width="1.5" />
  <text x="50" y="180" fill="#38bdf8" font-size="15" font-weight="bold">1. مرحلة فتح الاتصال (3-Way Handshake)</text>

  <!-- Client Note -->
  <rect x="45" y="195" width="195" height="44" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="142" y="214" text-anchor="middle" fill="#7dd3fc" font-size="12" font-family="monospace">socket.connect()</text>
  <text x="142" y="231" text-anchor="middle" fill="#94a3b8" font-size="11">State: SYN_SENT</text>

  <!-- Step 1: SYN -->
  <line x1="265" y1="205" x2="830" y2="235" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowRight)" />
  <text x="547.5" y="211" transform="rotate(3.04 547.5 220)" text-anchor="middle" fill="#38bdf8" font-size="13" font-family="monospace" font-weight="bold">[1] SYN (Seq = 0, Win = 64240, MSS = 1460)</text>

  <!-- Server Note SYN Queue -->
  <rect x="855" y="215" width="200" height="44" rx="5" fill="#0f172a" stroke="#64748b" stroke-width="1" />
  <text x="955" y="234" text-anchor="middle" fill="#cbd5e1" font-size="12">يدخل الـ SYN Queue</text>
  <text x="955" y="251" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="monospace">State: SYN_RCVD</text>

  <!-- Step 2: SYN-ACK -->
  <line x1="835" y1="260" x2="270" y2="290" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowLeft)" />
  <text x="552.5" y="266" transform="rotate(-3.04 552.5 275)" text-anchor="middle" fill="#34d399" font-size="13" font-family="monospace" font-weight="bold">[2] SYN-ACK (Seq = 0, Ack = 1, Win = 65160, MSS = 1460)</text>

  <!-- Step 3: ACK -->
  <line x1="265" y1="310" x2="830" y2="340" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowRight)" />
  <text x="547.5" y="316" transform="rotate(3.04 547.5 325)" text-anchor="middle" fill="#38bdf8" font-size="13" font-family="monospace" font-weight="bold">[3] ACK (Seq = 1, Ack = 1)  ➔  Connection ESTABLISHED!</text>

  <!-- Server Note Accept Queue -->
  <rect x="855" y="305" width="205" height="48" rx="5" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
  <text x="957" y="325" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="bold">It moves to the Accept Queue!</text>
  <text x="957" y="343" text-anchor="middle" fill="#ffffff" font-size="10.5" font-family="monospace">async_accept() callback fires</text>

  <!-- ================= PHASE 2: DATA TRANSFER ================= -->
  <rect x="30" y="375" width="1040" height="235" rx="8" fill="#1e293b" fill-opacity="0.55" stroke="#334155" stroke-width="1.5" />
  <text x="50" y="400" fill="#c084fc" font-size="15" font-weight="bold">2. مرحلة نقل البيانات (Byte Stream, Sequence Numbers &amp; Acknowledgments)</text>

  <!-- Send "Hello" (5 Bytes) -->
  <rect x="45" y="418" width="195" height="42" rx="5" fill="#0f172a" stroke="#c084fc" stroke-width="1" />
  <text x="142" y="436" text-anchor="middle" fill="#e9d5ff" font-size="12" font-family="monospace">send("Hello") // 5 Bytes</text>
  <text x="142" y="452" text-anchor="middle" fill="#94a3b8" font-size="11">Bytes #1, #2, #3, #4, #5</text>

  <line x1="265" y1="430" x2="830" y2="465" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrowDataRight)" />
  <text x="547.5" y="438.5" transform="rotate(3.54 547.5 447.5)" text-anchor="middle" fill="#e9d5ff" font-size="13" font-family="monospace" font-weight="bold">[4] PSH, ACK (Seq = 1, Ack = 1, Len = 5)  Payload: "Hello"</text>

  <!-- Server Reads -->
  <rect x="855" y="445" width="205" height="45" rx="5" fill="#0f172a" stroke="#c084fc" stroke-width="1" />
  <text x="957" y="464" text-anchor="middle" fill="#e9d5ff" font-size="11" font-family="monospace">async_read_some() -> 5B</text>
  <text x="957" y="481" text-anchor="middle" fill="#94a3b8" font-size="11">Next expected byte = 1 + 5 = 6</text>

  <!-- Server ACK + Echo -->
  <line x1="835" y1="495" x2="270" y2="530" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowLeft)" />
  <text x="552.5" y="503.5" transform="rotate(-3.54 552.5 512.5)" text-anchor="middle" fill="#34d399" font-size="13" font-family="monospace" font-weight="bold">[5] PSH, ACK (Seq = 1, Ack = 6, Len = 5)  Echo: "Hello"</text>
  <text x="550" y="551" text-anchor="middle" fill="#94a3b8" font-size="12">(لاحظ: Ack = 6 معناها استلمت لحد بايت 5 بنجاح ومستني منك بايت رقم 6)</text>

  <!-- Client ACKs Server's Echo -->
  <line x1="265" y1="570" x2="830" y2="600" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowRight)" />
  <text x="547.5" y="576" transform="rotate(3.04 547.5 585)" text-anchor="middle" fill="#38bdf8" font-size="13" font-family="monospace">[6] ACK (Seq = 6, Ack = 6, Len = 0)</text>

  <!-- ================= PHASE 3: CONNECTION TEARDOWN ================= -->
  <rect x="30" y="625" width="1040" height="270" rx="8" fill="#1e293b" fill-opacity="0.55" stroke="#334155" stroke-width="1.5" />
  <text x="50" y="650" fill="#fb7185" font-size="15" font-weight="bold">3. مرحلة إغلاق الاتصال بنظافة (4-Way Teardown &amp; EOF &amp; TIME_WAIT)</text>

  <!-- Client calls close() -->
  <rect x="45" y="665" width="195" height="44" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1" />
  <text x="142" y="684" text-anchor="middle" fill="#fda4af" font-size="12" font-family="monospace">close(fd) / Ctrl+C</text>
  <text x="142" y="701" text-anchor="middle" fill="#94a3b8" font-size="11">State: FIN_WAIT_1</text>

  <!-- FIN 1 -->
  <line x1="265" y1="680" x2="830" y2="710" stroke="#fb7185" stroke-width="2.5" marker-end="url(#arrowFin)" />
  <text x="547.5" y="686" transform="rotate(3.04 547.5 695)" text-anchor="middle" fill="#fda4af" font-size="13" font-family="monospace" font-weight="bold">[7] FIN, ACK (Seq = 6, Ack = 6)</text>

  <!-- Server receives EOF -->
  <rect x="855" y="690" width="205" height="50" rx="5" fill="#4c0519" stroke="#fb7185" stroke-width="1.5" />
  <text x="957" y="710" text-anchor="middle" fill="#fda4af" font-size="12" font-weight="bold">asio::error::eof!</text>
  <text x="957" y="728" text-anchor="middle" fill="#ffffff" font-size="11" font-family="monospace">State: CLOSE_WAIT</text>

  <!-- ACK of FIN 1 -->
  <line x1="835" y1="735" x2="270" y2="765" stroke="#34d399" stroke-width="2" marker-end="url(#arrowLeft)" />
  <text x="552.5" y="741" transform="rotate(-3.04 552.5 750)" text-anchor="middle" fill="#34d399" font-size="13" font-family="monospace">[8] ACK (Seq = 6, Ack = 7)  ➔  Client enters FIN_WAIT_2</text>

  <!-- Server calls conn->stop() -> FIN 2 -->
  <rect x="855" y="765" width="205" height="44" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1" />
  <text x="957" y="784" text-anchor="middle" fill="#fda4af" font-size="12" font-family="monospace">conn->stop() / close()</text>
  <text x="957" y="801" text-anchor="middle" fill="#94a3b8" font-size="11">State: LAST_ACK</text>

  <line x1="835" y1="785" x2="270" y2="815" stroke="#fb7185" stroke-width="2.5" marker-end="url(#arrowFin)" />
  <text x="552.5" y="791" transform="rotate(-3.04 552.5 800)" text-anchor="middle" fill="#fda4af" font-size="13" font-family="monospace" font-weight="bold">[9] FIN, ACK (Seq = 6, Ack = 7)</text>

  <!-- Final ACK -->
  <line x1="265" y1="835" x2="830" y2="865" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowRight)" />
  <text x="547.5" y="841" transform="rotate(3.04 547.5 850)" text-anchor="middle" fill="#38bdf8" font-size="13" font-family="monospace" font-weight="bold">[10] ACK (Seq = 7, Ack = 7)  ➔  Server CLOSED!</text>

  <!-- TIME_WAIT Box -->
  <rect x="45" y="822" width="195" height="55" rx="5" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" />
  <text x="142" y="842" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="bold">State: TIME_WAIT</text>
  <text x="142" y="860" text-anchor="middle" fill="#fde68a" font-size="11">(ينتظر ~60 ثانية قبل الحذف)</text>
</svg>