<svg xmlns="http://www.w3.org/2000/svg" width="780" height="764" viewBox="0 0 780 764" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --bg:#0d1117; --card:#161b22; --border:#2a313c; --text:#f0f6fc; --sub:#9aa7b4; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#ffffff; --card:#f6f8fa; --border:#d8dee4; --text:#1f2328; --sub:#59636e; }
    }
    text { font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif; direction: ltr; }
    .bg    { fill: var(--bg); stroke: var(--border); }
    .card  { fill: var(--card); stroke: var(--border); stroke-width: 1; }
    .bar   { fill: var(--c); }
    .badge { fill: var(--c); fill-opacity: .16; stroke: var(--c); stroke-width: 1.5; }
    .num   { fill: var(--c); font-size: 20px; font-weight: 700; }
    .name  { fill: var(--text); font-size: 18px; font-weight: 700; }
    .q     { fill: var(--text); font-size: 15px; direction: rtl; unicode-bidi: embed; }
    .tags  { fill: var(--sub); font-size: 13.5px; }
    .row   { opacity: 0; animation: in .5s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="779" height="763" rx="16"/>
  <g class="row" style="--c:#8b5cf6;animation-delay:0.0s">
    <rect class="card" x="16" y="16" width="748" height="96" rx="14"/>
    <rect class="bar" x="754" y="32" width="4" height="64" rx="2"/>
    <circle class="badge" cx="716" cy="64" r="23"/>
    <text class="num" x="716" y="71" text-anchor="middle">7</text>
    <text class="name" x="672" y="50" text-anchor="end">Application</text>
    <text class="q" x="672" y="74" text-anchor="start">البرنامج عايز يعمل إيه؟</text>
    <text class="tags" x="672" y="96" text-anchor="end">HTTP, DNS</text>
  </g>
  <g class="row" style="--c:#6366f1;animation-delay:0.1s">
    <rect class="card" x="16" y="122" width="748" height="96" rx="14"/>
    <rect class="bar" x="754" y="138" width="4" height="64" rx="2"/>
    <circle class="badge" cx="716" cy="170" r="23"/>
    <text class="num" x="716" y="177" text-anchor="middle">6</text>
    <text class="name" x="672" y="156" text-anchor="end">Presentation</text>
    <text class="q" x="672" y="180" text-anchor="start">إزاي البيانات تتمثل وتتفسر؟</text>
    <text class="tags" x="672" y="202" text-anchor="end">Encoding, encryption, compression</text>
  </g>
  <g class="row" style="--c:#3b82f6;animation-delay:0.2s">
    <rect class="card" x="16" y="228" width="748" height="96" rx="14"/>
    <rect class="bar" x="754" y="244" width="4" height="64" rx="2"/>
    <circle class="badge" cx="716" cy="276" r="23"/>
    <text class="num" x="716" y="283" text-anchor="middle">5</text>
    <text class="name" x="672" y="262" text-anchor="end">Session</text>
    <text class="q" x="672" y="286" text-anchor="start">إزاي تُدار جلسة التواصل؟</text>
    <text class="tags" x="672" y="308" text-anchor="end">Session management concepts</text>
  </g>
  <g class="row" style="--c:#06b6d4;animation-delay:0.3s">
    <rect class="card" x="16" y="334" width="748" height="96" rx="14"/>
    <rect class="bar" x="754" y="350" width="4" height="64" rx="2"/>
    <circle class="badge" cx="716" cy="382" r="23"/>
    <text class="num" x="716" y="389" text-anchor="middle">4</text>
    <text class="name" x="672" y="368" text-anchor="end">Transport</text>
    <text class="q" x="672" y="392" text-anchor="start">إزاي البيانات تنتقل بين التطبيقات؟</text>
    <text class="tags" x="672" y="414" text-anchor="end">TCP, UDP, ports</text>
  </g>
  <g class="row" style="--c:#10b981;animation-delay:0.4s">
    <rect class="card" x="16" y="440" width="748" height="96" rx="14"/>
    <rect class="bar" x="754" y="456" width="4" height="64" rx="2"/>
    <circle class="badge" cx="716" cy="488" r="23"/>
    <text class="num" x="716" y="495" text-anchor="middle">3</text>
    <text class="name" x="672" y="474" text-anchor="end">Network</text>
    <text class="q" x="672" y="498" text-anchor="start">إزاي نوصل لشبكة أو جهاز بعيد؟</text>
    <text class="tags" x="672" y="520" text-anchor="end">IPv4, IPv6, routing</text>
  </g>
  <g class="row" style="--c:#f59e0b;animation-delay:0.5s">
    <rect class="card" x="16" y="546" width="748" height="96" rx="14"/>
    <rect class="bar" x="754" y="562" width="4" height="64" rx="2"/>
    <circle class="badge" cx="716" cy="594" r="23"/>
    <text class="num" x="716" y="601" text-anchor="middle">2</text>
    <text class="name" x="672" y="580" text-anchor="end">Data Link</text>
    <text class="q" x="672" y="604" text-anchor="start">إزاي ننقل Frame على الوصلة المحلية؟</text>
    <text class="tags" x="672" y="626" text-anchor="end">Ethernet, MAC, VLAN</text>
  </g>
  <g class="row" style="--c:#ef4444;animation-delay:0.6s">
    <rect class="card" x="16" y="652" width="748" height="96" rx="14"/>
    <rect class="bar" x="754" y="668" width="4" height="64" rx="2"/>
    <circle class="badge" cx="716" cy="700" r="23"/>
    <text class="num" x="716" y="707" text-anchor="middle">1</text>
    <text class="name" x="672" y="686" text-anchor="end">Physical</text>
    <text class="q" x="672" y="710" text-anchor="start">إزاي الـ bits تنتقل فعليًا؟</text>
    <text class="tags" x="672" y="732" text-anchor="end">Electrical, optical, radio signals</text>
  </g>
</svg>