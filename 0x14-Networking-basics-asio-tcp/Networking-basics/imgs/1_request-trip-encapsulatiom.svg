<svg xmlns="http://www.w3.org/2000/svg" width="780" height="846" viewBox="0 0 780 846" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --bg:#0d1117; --card:#161b22; --border:#2a313c; --text:#f0f6fc; --sub:#9aa7b4; --chip:#262d38; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#ffffff; --card:#f6f8fa; --border:#d8dee4; --text:#1f2328; --sub:#59636e; --chip:#e6eaef; }
    }
    text  { font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif; direction: ltr; }
    .ar   { direction: rtl; unicode-bidi: embed; }
    .bg   { fill: var(--bg); stroke: var(--border); }
    .card { fill: var(--card); stroke: var(--border); }
    .bar  { fill: var(--c); }
    .lab  { fill: var(--c); font-size: 13px; font-weight: 600; }
    .title{ fill: var(--text); font-size: 20px; font-weight: 700; }
    .body { fill: var(--text); font-size: 15px; }
    .chip { fill: var(--chip); }
    .code { fill: var(--text); font-family: Consolas, "SF Mono", Menlo, monospace; font-size: 15px; }
    .arrow{ fill: none; stroke: var(--c); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .row, .arrow { opacity: 0; animation: in .5s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="779" height="845" rx="16"/>
  <g class="row" style="--c:#8b5cf6;animation-delay:0.00s">
    <rect class="card" x="16" y="16" width="748" height="128" rx="14"/>
    <rect class="bar" x="754" y="32" width="4" height="96" rx="2"/>
    <text class="lab" x="736" y="48" text-anchor="end">Layer 7 — Application</text>
    <text class="title" x="736" y="76" text-anchor="end">Application Data</text>
    <rect class="chip" x="669" y="95" width="67" height="28" rx="6"/>
    <text class="code" x="702.5" y="114" text-anchor="middle">Hello</text>
  </g>
  <g class="row" style="--c:#06b6d4;animation-delay:0.12s">
    <rect class="card" x="16" y="182" width="748" height="140" rx="14"/>
    <rect class="bar" x="754" y="198" width="4" height="108" rx="2"/>
    <text class="lab" x="736" y="214" text-anchor="end">Layer 4 — Transport</text>
    <text class="title" x="736" y="242" text-anchor="end">TCP Segment</text>
    <text class="body" x="736" y="272" text-anchor="end">TCP header + Hello</text>
    <text class="body ar" x="736" y="298" text-anchor="start">Source port, Destination port, Sequence number وغيرها.</text>
  </g>
  <g class="row" style="--c:#10b981;animation-delay:0.24s">
    <rect class="card" x="16" y="360" width="748" height="140" rx="14"/>
    <rect class="bar" x="754" y="376" width="4" height="108" rx="2"/>
    <text class="lab" x="736" y="392" text-anchor="end">Layer 3 — Network</text>
    <text class="title" x="736" y="420" text-anchor="end">IP Packet</text>
    <text class="body" x="736" y="450" text-anchor="end">IP header + TCP segment</text>
    <text class="body ar" x="736" y="476" text-anchor="start">Source IP و Destination IP.</text>
  </g>
  <g class="row" style="--c:#f59e0b;animation-delay:0.36s">
    <rect class="card" x="16" y="538" width="748" height="140" rx="14"/>
    <rect class="bar" x="754" y="554" width="4" height="108" rx="2"/>
    <text class="lab" x="736" y="570" text-anchor="end">Layer 2 — Data Link</text>
    <text class="title" x="736" y="598" text-anchor="end">Ethernet Frame</text>
    <text class="body" x="736" y="628" text-anchor="end">Ethernet header + IP packet + trailer</text>
    <text class="body ar" x="736" y="654" text-anchor="start">عناوين MAC الخاصة بالوصلة المحلية.</text>
  </g>
  <g class="row" style="--c:#ef4444;animation-delay:0.48s">
    <rect class="card" x="16" y="716" width="748" height="114" rx="14"/>
    <rect class="bar" x="754" y="732" width="4" height="82" rx="2"/>
    <text class="lab" x="736" y="748" text-anchor="end">Layer 1 — Physical</text>
    <text class="title" x="736" y="776" text-anchor="end">Bits as signals</text>
    <text class="body ar" x="736" y="806" text-anchor="start">إشارات كهربائية أو ضوئية أو لاسلكية حسب وسيلة الاتصال.</text>
  </g>
  <g>
    <path d="M390 150 V174 M384 168 L390 175 L396 168" class="arrow" style="--c:#06b6d4"/>
    <path d="M390 328 V352 M384 346 L390 353 L396 346" class="arrow" style="--c:#10b981"/>
    <path d="M390 506 V530 M384 524 L390 531 L396 524" class="arrow" style="--c:#f59e0b"/>
    <path d="M390 684 V708 M384 702 L390 709 L396 702" class="arrow" style="--c:#ef4444"/>
  </g>
</svg>