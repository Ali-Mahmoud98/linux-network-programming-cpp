<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="100%" height="100%" style="background-color: #0f172a; font-family: &#39;Segoe UI&#39;, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="depArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="wireArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <linearGradient id="bgBlueprint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="1100" height="660" fill="url(#bgBlueprint)" />

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">Folder and File Map from a System Architect’s Perspective</text>
  <text x="550" y="62" text-anchor="middle" font-size="14"><tspan fill="#7dd3fc">━▶ depends on (#include), always inward</tspan><tspan fill="#94a3b8" dx="12">|</tspan><tspan fill="#fbbf24" dx="12">┅▶ creates &amp; wires (main.cpp only)</tspan></text>

  <!-- ================= CENTER: CORE & PORTS (THE HEXAGON HEART) ================= -->
  <g transform="translate(380, 95)">
    <rect x="0" y="0" width="340" height="270" rx="12" fill="#064e3b" fill-opacity="0.7" stroke="#34d399" stroke-width="2.5" />
    <text x="170" y="28" text-anchor="middle" fill="#6ee7b7" font-size="16" font-weight="bold">Core Types &amp; Ports</text>
    <text x="170" y="46" text-anchor="middle" fill="#a7f3d0" font-size="12">Pure C++ — knows nothing about Asio or Linux</text>

    <!-- core/ folder: depends on nothing -->
    <rect x="20" y="58" width="300" height="72" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="35" y="80" fill="#34d399" font-size="14" font-weight="bold" font-family="monospace">📁 include/netserver/core/</text>
    <text x="45" y="100" fill="#e2e8f0" font-size="12" font-family="monospace">📄 Message.hpp  (الرسالة الخام)</text>
    <text x="45" y="118" fill="#e2e8f0" font-size="12" font-family="monospace">📄 PeerInfo.hpp (هوية المرسل)</text>

    <!-- ports/ folder: depends on core/ -->
    <rect x="20" y="140" width="300" height="120" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="35" y="162" fill="#38bdf8" font-size="14" font-weight="bold" font-family="monospace">📁 include/netserver/ports/</text>
    <text x="35" y="184" fill="#e2e8f0" font-size="12" font-family="monospace">📄 IMessageEndpoint.hpp  (start/stop)</text>
    <text x="35" y="202" fill="#e2e8f0" font-size="12" font-family="monospace">📄 IReplyChannel.hpp     (عقد الرد)</text>
    <text x="35" y="220" fill="#e2e8f0" font-size="12" font-family="monospace">📄 InboundMessage.hpp    (الطرْد)</text>
    <text x="35" y="238" fill="#e2e8f0" font-size="12" font-family="monospace">📄 InboundMessageHandler.hpp</text>
  </g>

  <!-- ================= LEFT: APPLICATION LAYER ================= -->
  <g transform="translate(35, 135)">
    <rect x="0" y="0" width="275" height="190" rx="12" fill="#1e1b4b" fill-opacity="0.8" stroke="#818cf8" stroke-width="2" />
    <text x="137" y="28" text-anchor="middle" fill="#a5b4fc" font-size="16" font-weight="bold">طبقة منطق التطبيق</text>
    <text x="137" y="48" text-anchor="middle" fill="#c7d2fe" font-size="13" font-family="monospace">📁 include/netserver/app/</text>

    <rect x="20" y="65" width="235" height="105" rx="8" fill="#0f172a" stroke="#6366f1" />
    <text x="137" y="90" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="monospace">📄 EchoHandler.hpp</text>
    <text x="137" y="115" text-anchor="middle" fill="#cbd5e1" font-size="12">Receives InboundMessage</text>
    <text x="137" y="135" text-anchor="middle" fill="#cbd5e1" font-size="12">وينفذ البزنس ويرد عبر</text>
    <text x="137" y="153" text-anchor="middle" fill="#34d399" font-size="12" font-family="monospace">IReplyChannel</text>
  </g>

  <!-- Arrow App -> Core/Ports -->
  <line x1="310" y1="230" x2="372" y2="230" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#depArrow)" />
  <text x="341" y="218" text-anchor="middle" fill="#7dd3fc" font-size="11">يعتمد على</text>

  <!-- ================= RIGHT: TRANSPORT ADAPTERS ================= -->
  <g transform="translate(790, 95)">
    <rect x="0" y="0" width="275" height="270" rx="12" fill="#3b0764" fill-opacity="0.7" stroke="#c084fc" stroke-width="2" />
    <text x="137" y="28" text-anchor="middle" fill="#e9d5ff" font-size="16" font-weight="bold">محولات النقل (Adapters)</text>
    <text x="137" y="48" text-anchor="middle" fill="#d8b4fe" font-size="12" font-family="monospace">📁 transport/tcp/ (Asio)</text>

    <rect x="20" y="65" width="235" height="85" rx="8" fill="#0f172a" stroke="#a855f7" />
    <text x="137" y="88" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold" font-family="monospace">📄 TcpServer (.hpp / .cpp)</text>
    <text x="137" y="108" text-anchor="middle" fill="#38bdf8" font-size="11" font-family="monospace">Implements IMessageEndpoint</text>
    <text x="137" y="128" text-anchor="middle" fill="#cbd5e1" font-size="11">يقبل الاتصالات ويدير الجلسات</text>

    <rect x="20" y="165" width="235" height="85" rx="8" fill="#0f172a" stroke="#a855f7" />
    <text x="137" y="188" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold" font-family="monospace">📄 TcpSession (.hpp / .cpp)</text>
    <text x="137" y="208" text-anchor="middle" fill="#34d399" font-size="11" font-family="monospace">Implements IReplyChannel</text>
    <text x="137" y="228" text-anchor="middle" fill="#cbd5e1" font-size="11">Manages the socket and the write queue</text>
  </g>

  <!-- Arrow Transport -> Core/Ports -->
  <line x1="790" y1="230" x2="728" y2="230" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#depArrow)" />
  <text x="759" y="218" text-anchor="middle" fill="#7dd3fc" font-size="11">يطبق عقود</text>

  <!-- ================= BOTTOM: COMPOSITION ROOT & SUPPORT ================= -->
  <g transform="translate(380, 425)">
    <rect x="0" y="0" width="340" height="105" rx="12" fill="#451a03" fill-opacity="0.8" stroke="#f59e0b" stroke-width="2" />
    <text x="170" y="28" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="bold">نقطة التجميع (Composition Root)</text>
    <text x="170" y="52" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="monospace">📄 src/main.cpp</text>
    <text x="170" y="74" text-anchor="middle" fill="#fde68a" font-size="12">Creates io_context + EchoHandler + TcpServer</text>
    <text x="170" y="92" text-anchor="middle" fill="#fde68a" font-size="12">(held as IMessageEndpoint), wires and runs</text>
  </g>

  <!-- Wiring arrows from main.cpp (not layer dependencies) -->
  <path d="M 380 475 L 172 475 L 172 333" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#wireArrow)" />
  <path d="M 720 475 L 927 475 L 927 373" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#wireArrow)" />

  <!-- Supporting folders bar -->
  <g transform="translate(35, 560)">
    <rect x="0" y="0" width="1030" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="515" y="25" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="bold">الفولدرات المساعدة (Cross-Cutting &amp; Tooling Directories)</text>
    <text x="140" y="50" text-anchor="middle" fill="#38bdf8" font-size="13" font-family="monospace">📁 common/ (debug.hpp)</text>
    <rect x="270" y="33" width="240" height="26" rx="6" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="390" y="50" text-anchor="middle" fill="#c084fc" font-size="13" font-family="monospace">📁 protocol/ (Planned: Framer)</text>
    <text x="660" y="50" text-anchor="middle" fill="#34d399" font-size="13" font-family="monospace">📁 docs/ (ملفات الشرح والـ SVG)</text>
    <text x="900" y="50" text-anchor="middle" fill="#fbbf24" font-size="13" font-family="monospace">📁 scripts/ (empty)</text>
  </g>
</svg>
